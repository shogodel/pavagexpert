name: Build & Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.DROPLET_SSH }}
          script: |
            cd ~/apps

            # Ensure .env exists for pavagexpert
            if [ ! -f .env ]; then
              PASSWORD=$(openssl rand -base64 12)
              echo "# Admin panel credentials - CHANGE THESE" > .env
              echo "ADMIN_USERNAME=admin" >> .env
              echo "ADMIN_PASSWORD=$PASSWORD" >> .env
              echo ">>> New admin password: $PASSWORD"
            fi

            # Update pavagexpert service in shared compose file
            awk '
            /^  pavagexpert:/ {
              print "  pavagexpert:"
              print "    container_name: pavagexpert"
              print "    image: ghcr.io/shogodel/pavagexpert:latest"
              print "    pull_policy: always"
              print "    restart: unless-stopped"
              print "    env_file: .env"
              print "    environment:"
              print "      - NODE_ENV=production"
              print "      - DATA_DIR=/data"
              print "    volumes:"
              print "      - jobs_data:/data"
              skip = 1
              next
            }
            skip && /^[a-z]/ { skip = 0 }
            skip { next }
            { print }
            ' docker-compose.yaml > /tmp/compose.tmp && mv /tmp/compose.tmp docker-compose.yaml

            # Add jobs_data volume if missing
            grep -q "jobs_data:" docker-compose.yaml || sed -i '/^volumes:/a\  jobs_data:' docker-compose.yaml

            docker compose pull pavagexpert
            docker compose up -d pavagexpert
            docker compose logs --tail 10 pavagexpert
            docker restart swag 2>/dev/null || true
            docker image prune -f
