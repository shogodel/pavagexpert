name: Build & Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.DROPLET_SSH }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            cd ~/apps

            # Write a BRAND NEW .env — no CRLF, no spaces, no garbage from old files.
            # This is the only way to guarantee clean values.
            cat > .env << 'ENVEOF'
ADMIN_USERNAME=admin
ADMIN_PASSWORD=P@55word
JWT_SECRET=__JWT_SECRET__
ENVEOF
            sed -i "s/__JWT_SECRET__/$(openssl rand -base64 32)/" .env

            # Ensure jobs_data volume exists
            docker volume inspect jobs_data >/dev/null 2>&1 || docker volume create jobs_data

            # Update pavagexpert service in shared compose file
            # Source the .env so we can inject vars into the compose environment section
            set -a; . .env; set +a

            awk -v admin_user="$ADMIN_USERNAME" -v admin_pass="$ADMIN_PASSWORD" -v jwt_secret="$JWT_SECRET" '
            /^  pavagexpert:/ {
              print "  pavagexpert:"
              print "    container_name: pavagexpert"
              print "    image: ghcr.io/shogodel/pavagexpert:latest"
              print "    pull_policy: always"
              print "    restart: unless-stopped"
              print "    env_file: .env"
              print "    environment:"
              print "      - NODE_ENV=production"
              print "      - DATA_DIR=/data"
              print "      - ADMIN_USERNAME=" admin_user
              print "      - ADMIN_PASSWORD=" admin_pass
              print "      - JWT_SECRET=" jwt_secret
              print "    volumes:"
              print "      - jobs_data:/data"
              skip = 1
              next
            }
            skip && /^[a-z]/ { skip = 0 }
            skip { next }
            { print }
            ' docker-compose.yaml > /tmp/compose.tmp && mv /tmp/compose.tmp docker-compose.yaml

            # Add jobs_data volume if missing
            grep -q "jobs_data:" docker-compose.yaml || sed -i '/^volumes:/a\  jobs_data:' docker-compose.yaml

            # Show updated compose section
            grep -A 10 "pavagexpert:" docker-compose.yaml

            # Log in to ghcr.io with GITHUB_TOKEN so we can pull the private package
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pull latest image and recreate container.
            # The entrypoint.sh seeds auth.json from env on first start.
            # auth-store.ts falls back to admin/admin if everything else fails.
            docker compose pull pavagexpert
            docker compose up -d pavagexpert --force-recreate
            sleep 3
            docker compose logs --tail 20 pavagexpert
            docker restart swag 2>/dev/null || true
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
