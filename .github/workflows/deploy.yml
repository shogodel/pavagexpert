name: Build & Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.DROPLET_SSH }}
          envs: GHCR_TOKEN,GHCR_USER,RESEND_API_KEY,NOTIFICATION_EMAIL,WORDPRESS_API_URL,WORDPRESS_API_KEY
          script: |
            set -e
            cd ~/apps

            docker rm -f pavagexpert 2>/dev/null || true
            docker rm -f pavagexpert-pavexpert-1 2>/dev/null || true

            if [ -f .env ]; then
              OLD_RESEND_KEY=$(grep "^RESEND_API_KEY=" .env | cut -d= -f2-) || :
              OLD_NOTIFICATION_EMAIL=$(grep "^NOTIFICATION_EMAIL=" .env | cut -d= -f2-) || :
            fi

            {
              echo "RESEND_API_KEY=${OLD_RESEND_KEY:-$RESEND_API_KEY}"
              echo "NOTIFICATION_EMAIL=${OLD_NOTIFICATION_EMAIL:-$NOTIFICATION_EMAIL}"
              echo "WORDPRESS_API_URL=${WORDPRESS_API_URL}"
              echo "WORDPRESS_API_KEY=${WORDPRESS_API_KEY}"
            } > .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            curl -sSL -o docker-compose.pavagexpert.yaml \
              https://raw.githubusercontent.com/shogodel/pavagexpert/master/docker-compose.pavagexpert.yaml

            docker compose -f docker-compose.pavagexpert.yaml pull pavagexpert
            docker compose -f docker-compose.pavagexpert.yaml up -d pavagexpert --force-recreate

            echo "[deploy] waiting for app health check..."
            for i in $(seq 1 30); do
              docker compose -f docker-compose.pavagexpert.yaml exec -T pavagexpert curl -sf http://localhost:3000/api/health > /dev/null 2>&1 && break
              sleep 2
            done

            docker compose -f docker-compose.pavagexpert.yaml logs --tail 20 pavagexpert

            docker exec swag sh -c "sed -i '/resolver 127.0.0.11/d; /set \$upstream_pavagexpert/d; s|proxy_pass http://\\\$upstream_pavagexpert|proxy_pass http://pavagexpert:3000|' /config/nginx/site-confs/default.conf" 2>/dev/null || true
            docker exec swag nginx -s reload 2>/dev/null || true
            docker restart swag 2>/dev/null || true
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          WORDPRESS_API_URL: ${{ secrets.WORDPRESS_API_URL }}
          WORDPRESS_API_KEY: ${{ secrets.WORDPRESS_API_KEY }}
