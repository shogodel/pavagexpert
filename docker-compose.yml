name: pavagexpert

services:
  pavagexpert:
    container_name: pavagexpert
    image: ghcr.io/shogodel/pavagexpert:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - pavagexpert-db
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - DATABASE_URL=postgresql://pavagexpert:${DB_PASSWORD}@pavagexpert-db:5432/pavagexpert
    volumes:
      - jobs_data:/data

  pavagexpert-db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pavagexpert_pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: pavagexpert
      POSTGRES_USER: pavagexpert
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pavagexpert"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  jobs_data:
    external: true
  pavagexpert_pg_data:
    external: true

networks:
  default:
    external: true
    name: apps_default
