services:
  pavagexpert:
    container_name: pavagexpert
    image: ghcr.io/shogodel/pavagexpert:latest
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
    volumes:
      - jobs_data:/data

volumes:
  jobs_data:

networks:
  default:
    external: true
    name: apps_default
