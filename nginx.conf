events {}

http {
  upstream pavexpert {
    server pavexpert:3000;
  }

  server {
    listen 80;
    server_name pavagexpert.space www.pavagexpert.space;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name pavagexpert.space www.pavagexpert.space;

    ssl_certificate /etc/nginx/ssl/live/pavagexpert.space/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/pavagexpert.space/privkey.pem;

    location / {
      proxy_pass http://pavexpert;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
